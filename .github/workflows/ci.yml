name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      # go.mod pins the oldest supported discordgo; this keeps the newest honest too.
      - name: Test against the newest discordgo
        if: matrix.go == 'stable'
        run: |
          go get github.com/bwmarrin/discordgo@latest
          go vet ./...
          go test -race ./...
